{% extends "base.html" %}

{% block content %}
    <h2>Kids Dashboard</h2>
    <div class="kid-list">
        {% for kid in kids %}
            <div class="kid-card">
                <img src="{{ url_for('static', filename='assets/kids/' + kid.photo) }}" alt="{{ kid.name }}" class="kid-avatar">
                <h3>{{ kid.name }}</h3>
                <p>Points: {{ kid.points }}</p>
                <a href="{{ url_for('main.kid_profile', kid_id=kid.id) }}" class="button">View Profile</a>
            </div>
        {% endfor %}
    </div>
{% endblock %}
