{% extends "base.html" %}

{% block content %}
    <h2>Add New Kid</h2>
    <form action="{{ url_for('main.add_kid') }}" method="post" enctype="multipart/form-data" class="add-kid-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="photo">Photo:</label>
        <input type="file" id="photo" name="photo" accept="image/*">
        <button type="submit" class="button">Add Kid</button>
    </form>
{% endblock %}
